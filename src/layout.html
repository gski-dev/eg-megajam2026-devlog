<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta name="theme-color" content="#f3f0e8">
    <link rel="canonical" href="{{canonical}}">
    <link rel="icon" href="{{base}}/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{base}}/assets/css/site.css">
    <link rel="alternate" type="application/atom+xml" title="EG / MegaJam 2026" href="{{base}}/feed.xml">
    <meta property="og:site_name" content="EG / MegaJam 2026">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{canonical}}">
    <meta property="og:type" content="{{ogType}}">
    <meta property="og:image" content="{{siteUrl}}{{base}}/assets/images/social-card.png">
    <meta name="twitter:card" content="summary_large_image">
    {{articleMeta}}
    <script type="module" src="{{base}}/assets/js/site.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="edition-bar"><div class="shell"><span>Development journal <span aria-hidden="true">/</span> 2026</span><span>Unreal Engine <span aria-hidden="true">·</span> Work in progress</span></div></div>
    <header class="site-header shell">
      <a class="wordmark" href="{{base}}/" aria-label="EG MegaJam 2026 home"><span class="brand-mark" aria-hidden="true">EG<span>↗</span></span><span>MegaJam<span class="wordmark-year">2026 / Devlog</span></span></a>
      <nav aria-label="Main navigation">{{navigation}}<a class="github-link" href="{{githubUrl}}">GitHub <span aria-hidden="true">↗</span></a></nav>
    </header>
    <main id="main">{{content}}</main>
    <footer class="site-footer shell">
      <a class="footer-brand" href="{{base}}/">EG / MegaJam 2026</a>
      <p>A game in progress. A record of how it gets made.</p>
      <div><a href="{{base}}/feed.xml">RSS feed ↗</a><a href="{{githubUrl}}">View the repository ↗</a></div>
    </footer>
  </body>
</html>
